# Smithery configuration for Meta Ads (Facebook & Instagram)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_meta_ads

name: meta_ads-mcp
displayName: "Meta Ads (Facebook & Instagram)"
description: >
  Leitura e gestão de campanhas Meta Ads, ad sets, ads, audiências, páginas e Business Manager. Você fornece um long-lived access_token e o Facebook App ID (FB_API_ID).

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/meta_ads-mcp
repository: https://github.com/mcp-dir/meta_ads-mcp

tags:
  - meta_ads
  - brazil
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_meta_ads

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_meta_ads/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
